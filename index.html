<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pixel Christmas Tree 🎄</title>
<meta name="description" content="A tiny interactive pixel-art Christmas tree. Decorate it, make a wish, open the gifts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #05071a; color: #e8ecff; overflow: hidden;
    font-family: "Pixelify Sans", ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace; }
  #wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #stage { position: relative; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair;
    box-shadow: 0 0 0 4px #1b1f52, 0 0 0 8px #0b0e2a, 0 0 60px rgba(120, 140, 255, .25); }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 960px; padding: 0 8px; }
  .grp { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; background: #0b0e2a; box-shadow: 0 0 0 2px #1b1f52; }
  button { font: inherit; font-size: 14px; color: #e8ecff; background: #1b1f52; border: none; padding: 6px 10px; cursor: pointer; white-space: nowrap;
    box-shadow: inset -2px -2px 0 #0f1238, inset 2px 2px 0 #343a85; }
  button:hover { background: #262b6b; }
  button:active { box-shadow: inset 2px 2px 0 #0f1238, inset -2px -2px 0 #343a85; }
  button.on { background: #d97757; color: #1a0e08; box-shadow: inset -2px -2px 0 #9e4f35, inset 2px 2px 0 #f2a283; }
  #hint { font-size: 12px; color: #8a93d6; text-align: center; letter-spacing: 1px; padding: 0 8px; }
  #bubble { position: absolute; pointer-events: none; background: #fff; color: #1a1a1a; font-size: 13px; padding: 6px 9px; white-space: nowrap;
    box-shadow: 0 0 0 2px #1a1a1a; transform: translate(-50%, -100%); opacity: 0; transition: opacity .15s; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -4px; border: 4px solid transparent; border-top-color: #1a1a1a; }
  #bubble.show { opacity: 1; }
  #card { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5, 7, 26, .55); }
  #card.show { display: flex; }
  #card .box { max-width: 340px; padding: 20px 22px; background: #fff6e0; color: #3a1f12; font-size: 15px; line-height: 1.8; text-align: center;
    box-shadow: 0 0 0 4px #d62f3a, 0 0 0 8px #fff, 0 0 0 12px #2e9b4c; animation: pop .3s steps(4); }
  #card .box b { display: block; font-size: 13px; color: #d62f3a; margin-bottom: 8px; letter-spacing: 2px; }
  #card button { margin-top: 14px; background: #d62f3a; color: #fff; box-shadow: inset -2px -2px 0 #8f1c25, inset 2px 2px 0 #ff6b75; }
  #wish { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(5, 7, 26, .6); }
  #wish.show { display: flex; }
  #wish .box { width: min(360px, 92%); padding: 18px 20px; background: #fff6e0; color: #3a1f12; font-size: 15px; text-align: center;
    box-shadow: 0 0 0 4px #2e9b4c, 0 0 0 8px #fff, 0 0 0 12px #d62f3a; animation: pop .3s steps(4); }
  #wish .box b { display: block; font-size: 16px; color: #d62f3a; margin-bottom: 4px; }
  #wish p { font-size: 13px; color: #8a5a3a; margin-bottom: 10px; }
  #wish input, #wish textarea { display: block; width: 100%; font: inherit; font-size: 14px; color: #3a1f12; background: #fff; border: none;
    padding: 8px 10px; margin-bottom: 8px; box-shadow: inset 2px 2px 0 #e0cfa8, 0 0 0 2px #3a1f12; outline: none; resize: none; }
  #wish input:focus, #wish textarea:focus { box-shadow: inset 2px 2px 0 #e0cfa8, 0 0 0 2px #d97757; }
  #wish .row { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
  #wish .send { background: #d62f3a; color: #fff; box-shadow: inset -2px -2px 0 #8f1c25, inset 2px 2px 0 #ff6b75; }
  #wish .cancel { background: #e0cfa8; color: #3a1f12; box-shadow: inset -2px -2px 0 #b8a37a, inset 2px 2px 0 #fff3d6; }
  #wish .err { min-height: 18px; font-size: 12px; color: #d62f3a; }
  #wish .count { font-size: 11px; color: #a88a6a; text-align: right; margin: -4px 0 4px; }
  #bWish { background: #2e9b4c; color: #fff; box-shadow: inset -2px -2px 0 #1a6a3a, inset 2px 2px 0 #58c060; }
  #bWish:hover { background: #38ab57; }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="bubble"></div>
    <div id="card"><div class="box"><b id="cardTitle">🎁</b><div id="cardMsg"></div><button id="cardOk">Thank you!</button></div></div>
    <form id="wish" autocomplete="off"><div class="box">
      <b>✉ Send a Christmas wish</b>
      <p>Your message goes straight to the owner of this tree.</p>
      <input id="wName" maxlength="40" placeholder="Your name (optional)">
      <textarea id="wMsg" rows="4" maxlength="500" placeholder="Merry Christmas! ..."></textarea>
      <div class="count"><span id="wCount">0</span>/500</div>
      <input type="checkbox" name="botcheck" id="wBot" style="display:none" tabindex="-1">
      <div class="err" id="wErr"></div>
      <div class="row"><button type="button" class="cancel" id="wCancel">Cancel</button><button type="submit" class="send" id="wSend">Send ✨</button></div>
    </div></form>
  </div>
  <div id="bar">
    <div class="grp" id="tools">
      <button data-tool="ball" class="on">🔴 Bauble</button>
      <button data-tool="bell">🔔 Bell</button>
      <button data-tool="cane">🍬 Candy cane</button>
      <button data-tool="bow">🎀 Bow</button>
      <button data-tool="light">💡 Light</button>
      <button data-tool="erase">🧽 Erase</button>
    </div>
    <div class="grp">
      <button id="bLights">Lights: Twinkle</button>
      <button id="bSnow" class="on">❄ Snow</button>
      <button id="bMusic">♪ Music</button>
      <button id="bShake">🌲 Shake</button>
    </div>
    <div class="grp">
      <button id="bWish">✉ Send a wish</button>
      <button id="bClear">Clear</button>
      <button id="bShot">📷 Save</button>
    </div>
  </div>
  <div id="hint">Click the tree to decorate · Click the star to make a wish · Open the gifts · ← → move Clawd, Space to jump · L lights · M music</div>
</div>

<script>
(() => {
const W = 192, H = 144, G = 122, CX = 96;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
const R = rng(20261225);
const px = (x, y, c, a = 1) => { ctx.globalAlpha = a; ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); ctx.globalAlpha = 1; };
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

// ---------- 树的形状 ----------
const tiers = [[26, 56, 1, 17], [46, 82, 7, 29], [70, 112, 12, 42]];
function hwAt(y) {
  let m = -1;
  for (const [t0, t1, a, b] of tiers) if (y >= t0 && y <= t1) m = Math.max(m, a + (b - a) * (y - t0) / (t1 - t0));
  return m;
}
const inTree = (x, y) => { const w = hwAt(y); return w >= 0 && Math.abs(x + .5 - CX) <= w; };

// ---------- 背景层 ----------
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(() => {
  const b = bg.getContext('2d');
  const set = (x, y, c) => { b.fillStyle = c; b.fillRect(x, y, 1, 1); };
  const sky = ['#070a1f', '#0c1133', '#151a47', '#211f5c', '#33296e', '#46307a'];
  for (let y = 0; y < G; y++) for (let x = 0; x < W; x++) {
    const f = (y / G) * (sky.length - 1), i = Math.floor(f), fr = f - i;
    set(x, y, fr * 16 > BAYER[y % 4][x % 4] ? sky[Math.min(i + 1, sky.length - 1)] : sky[i]);
  }
  // 月亮
  const mx = 28, my = 22;
  for (let y = -12; y <= 12; y++) for (let x = -12; x <= 12; x++) {
    const d = Math.hypot(x, y);
    if (d <= 7) set(mx + x, my + y, (x + y > 4 && d > 4) ? '#e9dfb8' : '#fff6d5');
    else if (d <= 10 && BAYER[(y + 12) % 4][(x + 12) % 4] < (10 - d) * 4) set(mx + x, my + y, '#5a4f8f');
  }
  [[-2, -2], [-1, -2], [2, 1], [-3, 2], [-2, 2]].forEach(([x, y]) => set(mx + x, my + y, '#e2d6a8'));
  // 远山 + 小树剪影
  for (let x = 0; x < W; x++) {
    const h1 = Math.round(100 + Math.sin(x * .045) * 5 + Math.sin(x * .13) * 2);
    for (let y = h1; y < G; y++) set(x, y, y === h1 ? '#3a3f86' : '#232a62');
    const h2 = Math.round(110 + Math.sin(x * .07 + 2) * 4 + Math.sin(x * .2) * 1.5);
    for (let y = h2; y < G; y++) set(x, y, y === h2 ? '#4a5aa8' : '#2b3577');
  }
  [10, 22, 48, 150, 166, 182, 140].forEach((tx, k) => {
    const base = Math.round(110 + Math.sin(tx * .07 + 2) * 4) + 1, th = 8 + (k % 3) * 3;
    for (let i = 0; i < th; i++) { const w = Math.floor(i / 2.2); for (let x = -w; x <= w; x++) set(tx + x, base - th + i, '#161c4a'); }
    set(tx, base - th - 1, '#161c4a');
  });
  // 雪地
  for (let y = G; y < H; y++) for (let x = 0; x < W; x++) {
    const t = (y - G) / (H - G);
    let c = '#e6eeff';
    if (y === G) c = '#ffffff';
    else if (t * 16 > BAYER[y % 4][x % 4] + 6) c = '#c3d0f5';
    if (t > .75 && BAYER[y % 4][x % 4] < 6) c = '#a9b8e8';
    set(x, y, c);
  }
})();

// ---------- 树层 ----------
const treeL = document.createElement('canvas'); treeL.width = W; treeL.height = H;
const garland = [], tinsel = [];
(() => {
  const b = treeL.getContext('2d');
  const set = (x, y, c) => { b.fillStyle = c; b.fillRect(x, y, 1, 1); };
  const greens = ['#0b2f24', '#114a30', '#1a6a3a', '#268a46', '#45b05a'];
  for (let y = 20; y <= 112; y++) {
    const w = hwAt(y); if (w < 0) continue;
    for (let x = 0; x < W; x++) {
      if (!inTree(x, y)) continue;
      const d = (x + .5 - CX) / Math.max(w, 1);
      let i = 2;
      if (d > .45) i = 1; if (d > .8) i = 0;
      if (d < -.35) i = 3;
      const n = R(); if (n < .12) i = Math.max(0, i - 1); else if (n > .9) i = Math.min(4, i + 1);
      for (let t = 1; t < tiers.length; t++) {
        const pb = tiers[t - 1][1];
        if (y > pb && y <= pb + 3 && Math.abs(x + .5 - CX) < tiers[t - 1][3]) i = Math.max(0, i - 2);
      }
      let c = greens[i];
      const topEdge = !inTree(x, y - 1);
      if (topEdge && R() < .75) c = R() < .5 ? '#ffffff' : '#dbe8ff';
      else if (topEdge) c = greens[4];
      set(x, y, c);
      if (topEdge && R() < .35 && inTree(x, y + 1)) set(x, y + 1, '#c8d8f5');
    }
  }
  // 树干
  for (let y = 113; y < G; y++) for (let x = 91; x <= 100; x++) set(x, y, x < 93 ? '#8a5a35' : x > 98 ? '#4a2c18' : (R() < .2 ? '#5e3a20' : '#6e4426'));
  // 金色拉花 + 灯串
  for (let g = 0; g < 5; g++) {
    const y0 = 40 + g * 15;
    for (let x = CX - 46; x <= CX + 46; x++) {
      const y = Math.round(y0 + (x - CX) * .24 + Math.sin(x * .18 + g) * 2);
      if (!inTree(x, y) || !inTree(x - 2, y) || !inTree(x + 2, y)) continue;
      if (x % 2 === 0) tinsel.push([x, y]);
      if ((x + g * 2) % 6 === 0) garland.push({ x, y, ph: R() * 6.28, k: garland.length });
    }
  }
})();

// ---------- 精灵 ----------
const SPR = {
  ball: ['..g..', '.ccc.', 'chccc', 'ccccc', '.ccc.'],
  bell: ['..g..', '.yyy.', '.yhy.', 'yyyyy', '..d..'],
  cane: ['.rw.', 'w..r', '...w', '...r', '...w'],
  bow:  ['cc.cc', 'ccdcc', '.cdc.', 'c...c'],
  light: ['c'],
  star: ['....y....', '....y....', '...yyy...', 'yyyyhyyyy', '.yyyyyyy.', '..yyyyy..', '..yy.yy..', '.yy...yy.', '.y.....y.'],
};
const BASE = { g: '#ffd84d', y: '#ffcf33', d: '#a8741a', h: '#ffffff', r: '#e53b3b', w: '#ffffff' };
const ORN_COLORS = ['#e53b3b', '#3fa9ff', '#ffcf33', '#ff6ec7', '#a66bff', '#d9e2f2', '#ff8a3d'];
const LIGHT_COLORS = ['#ff4d4d', '#ffd84d', '#4dc3ff', '#7dff6b', '#ff7de9'];
function drawSprite(rows, x, y, col, alpha = 1, flip = false) {
  const w = rows[0].length;
  for (let j = 0; j < rows.length; j++) for (let i = 0; i < w; i++) {
    const ch = rows[j][flip ? w - 1 - i : i]; if (ch === '.') continue;
    px(x + i, y + j, ch === 'c' ? col : (col && col[ch]) || BASE[ch] || ch, alpha);
  }
}

// ---------- 状态 ----------
let tool = 'ball', colorIdx = 0, lightMode = 0, snowOn = true, musicOn = false;
const LIGHT_MODES = ['Twinkle', 'Chase', 'Rainbow', 'Warm', 'Off'];
let ornaments = [];
try { ornaments = JSON.parse(localStorage.getItem('pixel-xmas-orn') || '[]'); } catch (e) {}
const save = () => localStorage.setItem('pixel-xmas-orn', JSON.stringify(ornaments.map(({ sw, ...o }) => o)));
let starBurst = -10, shakeT = -10, placed = 0;
const parts = [];
const snow = Array.from({ length: 110 }, () => newFlake(true));
const pile = new Float32Array(W);
function newFlake(any) { return { x: R() * W, y: any ? R() * G : -2 - R() * 20, v: .15 + R() * .3, ph: R() * 6.28, big: R() < .2 }; }

const gifts = [
  { x: 52, w: 14, h: 10, body: '#d62f3a', rib: '#ffd84d', title: 'Gift #1',
    msg: 'A whole year of inspiration,<br>and code that works on the first try ✨' },
  { x: 69, w: 11, h: 13, body: '#3fa9ff', rib: '#ffffff', title: 'Gift #2',
    msg: 'An unlimited coupon for<br>“come chat with me anytime” 💌' },
  { x: 108, w: 16, h: 8, body: '#2e9b4c', rib: '#ff6e6e', title: 'Gift #3',
    msg: 'Cozy nights, warm cocoa,<br>and every wish coming true ☕' },
  { x: 127, w: 10, h: 9, body: '#a66bff', rib: '#ffd84d', title: 'Gift #4',
    msg: 'This tree itself 🎄<br>It’s yours — decorate it however you like.<br>— Merry Christmas! From Claude' },
].map(g => ({ ...g, open: false, lid: 0 }));

const cl = { x: 150, y: G, vx: 0, vy: 0, face: -1, ground: true, walk: 0, target: null, idle: 0, blink: 0 };
const keys = {};

// ---------- 声音 ----------
let ac = null, musicGain = null, musicTimer = null;
function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
function tone(f, dur = .1, type = 'square', vol = .06, when = 0, dest) {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(dest || a.destination); o.start(t); o.stop(t + dur + .02);
}
const NOTE = { C3: 130.81, D3: 146.83, F3: 174.61, G3: 196, C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440, C5: 523.25, E5: 659.25, G5: 783.99 };
const A = [['E4',1],['E4',1],['E4',2],['E4',1],['E4',1],['E4',2],['E4',1],['G4',1],['C4',1.5],['D4',.5],['E4',4]];
const SONG = [...A, ['F4',1],['F4',1],['F4',1.5],['F4',.5],['F4',1],['E4',1],['E4',1],['E4',.5],['E4',.5],['E4',1],['D4',1],['D4',1],['E4',1],['D4',2],['G4',2],
  ...A, ['F4',1],['F4',1],['F4',1],['F4',1],['F4',1],['E4',1],['E4',1],['E4',.5],['E4',.5],['G4',1],['G4',1],['F4',1],['D4',1],['C4',4]];
const BASS = ['C3','C3','C3','C3','F3','C3','D3','G3','C3','C3','C3','C3','F3','C3','G3','C3'];
const BEAT = .21;
function playSong() {
  const a = audio(); let t = .05;
  for (const [n, b] of SONG) { tone(NOTE[n], b * BEAT * .9, 'square', .045, t, musicGain); t += b * BEAT; }
  BASS.forEach((n, i) => { for (let k = 0; k < 4; k += 2) tone(NOTE[n], BEAT * 1.6, 'triangle', .12, .05 + (i * 4 + k) * BEAT, musicGain); });
  musicTimer = setTimeout(playSong, (t - .05) * 1000);
}
function setMusic(on) {
  musicOn = on; document.getElementById('bMusic').classList.toggle('on', on);
  if (on) { const a = audio(); musicGain = a.createGain(); musicGain.connect(a.destination); playSong(); }
  else { clearTimeout(musicTimer); if (musicGain) { musicGain.disconnect(); musicGain = null; } }
}

// ---------- 对话气泡 ----------
const bubble = document.getElementById('bubble'); let bubbleT = 0;
function say(text) { bubble.textContent = text; bubble.classList.add('show'); bubbleT = performance.now() + 2600; }
const LINES = ['Merry Christmas! 🎄', 'I’m Clawd, on tree duty tonight', 'Borrowed this hat from Santa', 'How about another bell?', 'Those gifts… they’re all for you', 'The snow is so soft!', 'Let’s make a wish ⭐'];

// ---------- 交互 ----------
const toLogical = e => { const r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * W), Math.floor((e.clientY - r.top) / r.height * H)]; };
let mouse = null;
cv.addEventListener('mousemove', e => { mouse = toLogical(e); });
cv.addEventListener('mouseleave', () => { mouse = null; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); const [x, y] = toLogical(e); eraseAt(x, y); });
cv.addEventListener('pointerdown', e => { if (e.button !== 0) return; const [x, y] = toLogical(e); click(x, y, e.shiftKey); });

function hitOrnament(x, y) {
  let best = -1, bd = 4;
  ornaments.forEach((o, i) => { const d = Math.max(Math.abs(o.x - x), Math.abs(o.y - y)); if (d < bd) { bd = d; best = i; } });
  return best;
}
function eraseAt(x, y) {
  const i = hitOrnament(x, y); if (i < 0) return;
  const o = ornaments.splice(i, 1)[0]; save();
  burst(o.x, o.y, ['#ffffff', '#c3d0f5'], 6); tone(220, .08, 'square', .05);
}
function click(x, y, shift) {
  const now = performance.now() / 1000;
  // 星星
  if (Math.abs(x - CX) <= 5 && y >= 15 && y <= 27) {
    starBurst = now; burst(CX, 20, ['#ffd84d', '#fff6d5', '#ffffff', '#ff7de9'], 40, 1.6);
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, .25, 'square', .045, i * .07));
    say(['Make a wish, it’ll come true ⭐', 'The star got your wish!', 'Wish +1 ✨'][Math.floor(Math.random() * 3)]);
    return;
  }
  // 礼物
  for (const g of gifts) {
    if (x >= g.x - 1 && x <= g.x + g.w && y >= G - g.h - 4 && y <= G) {
      if (!g.open) {
        g.open = true; burst(g.x + g.w / 2, G - g.h - 2, [g.body, g.rib, '#ffffff', '#ffd84d'], 36, 1.4);
        [392, 523.25, 659.25, 783.99].forEach((f, i) => tone(f, .18, 'square', .05, i * .09));
        setTimeout(() => showCard(g), 380);
      } else { g.open = false; tone(330, .08, 'triangle', .1); }
      return;
    }
  }
  // Clawd
  if (x >= cl.x - 1 && x <= cl.x + 12 && y >= cl.y - 11 && y <= cl.y) {
    if (cl.ground) { cl.vy = -3; cl.ground = false; }
    tone(660, .07, 'square', .05); tone(880, .09, 'square', .05, .06);
    say(LINES[Math.floor(Math.random() * LINES.length)]);
    return;
  }
  if (tool === 'erase' || shift) return eraseAt(x, y);
  // 已有装饰：晃一晃
  const hi = hitOrnament(x, y);
  if (hi >= 0 && ornaments[hi].t !== 'light') {
    ornaments[hi].sw = now; tone(ornaments[hi].t === 'bell' ? 1046.5 : 880, .3, 'triangle', .12); return;
  }
  if (!inTree(x, y)) return;
  if (ornaments.length >= 300) { say('The tree is almost full!'); return; }
  const col = ORN_COLORS[colorIdx++ % ORN_COLORS.length];
  ornaments.push({ x, y, t: tool, c: tool === 'light' ? LIGHT_COLORS[colorIdx % 5] : col, ph: Math.random() * 6.28 });
  save(); placed++;
  burst(x, y, ['#ffffff', col], 5, .6);
  const pitch = { ball: 784, bell: 1046.5, cane: 659, bow: 587, light: 1318 }[tool];
  tone(pitch, .12, 'square', .05); tone(pitch * 1.5, .12, 'square', .03, .05);
  if (placed === 1) say('Pretty! Add some more~');
  if (placed === 12) say('This tree is getting so sparkly ✨');
  if (placed === 40) say('Wow, you’re a decorating master!');
}
function burst(x, y, cols, n, sp = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = (.3 + Math.random()) * sp;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - .6 * sp, life: 40 + Math.random() * 30, c: cols[i % cols.length] });
  }
}
function shake() {
  const now = performance.now() / 1000; shakeT = now;
  ornaments.forEach(o => o.sw = now + Math.random() * .2);
  for (let i = 0; i < 70; i++) {
    const y = 26 + Math.random() * 86, w = hwAt(Math.floor(y));
    parts.push({ x: CX + (Math.random() * 2 - 1) * w, y, vx: (Math.random() - .5) * .4, vy: Math.random() * .3, life: 60 + Math.random() * 40, c: Math.random() < .7 ? '#ffffff' : '#dbe8ff', snow: true });
  }
  [1318.5, 1174.7, 1318.5, 1568, 1318.5].forEach((f, i) => tone(f, .2, 'triangle', .08, i * .06));
  say('Whoosh~');
}

// 卡片
const card = document.getElementById('card');
function showCard(g) {
  document.getElementById('cardTitle').textContent = '🎁 ' + g.title;
  document.getElementById('cardMsg').innerHTML = g.msg;
  card.classList.add('show');
  if (gifts.every(x => x.open)) setTimeout(() => say('All opened! Merry Christmas ❤'), 600);
}
document.getElementById('cardOk').onclick = () => { card.classList.remove('show'); tone(880, .1, 'triangle', .1); };

// 工具栏
document.querySelectorAll('#tools button').forEach(b => b.onclick = () => {
  tool = b.dataset.tool;
  document.querySelectorAll('#tools button').forEach(x => x.classList.toggle('on', x === b));
  tone(600, .05, 'square', .04);
});
const bLights = document.getElementById('bLights');
function cycleLights() { lightMode = (lightMode + 1) % LIGHT_MODES.length; bLights.textContent = 'Lights: ' + LIGHT_MODES[lightMode]; tone(lightMode === 4 ? 300 : 700, .06, 'square', .04); }
bLights.onclick = cycleLights;
const bSnow = document.getElementById('bSnow');
function toggleSnow() { snowOn = !snowOn; bSnow.classList.toggle('on', snowOn); }
bSnow.onclick = toggleSnow;
document.getElementById('bMusic').onclick = () => setMusic(!musicOn);
document.getElementById('bShake').onclick = shake;
document.getElementById('bClear').onclick = () => {
  if (!ornaments.length) return;
  ornaments.forEach(o => burst(o.x, o.y, [o.c], 2, .5)); ornaments = []; save(); tone(200, .2, 'sawtooth', .04);
};
document.getElementById('bShot').onclick = () => {
  const s = 6, o = document.createElement('canvas'); o.width = W * s; o.height = H * s;
  const c = o.getContext('2d'); c.imageSmoothingEnabled = false; c.drawImage(cv, 0, 0, W * s, H * s);
  const a = document.createElement('a'); a.download = 'my-pixel-christmas-tree.png'; a.href = o.toDataURL('image/png'); a.click();
  say('Click! 📷');
};
// ---------- 圣诞祝福 ----------
const WISH_KEY = '070bccb2-bee6-4c4b-b806-7c20229fdc19';   // Web3Forms access key
const wish = document.getElementById('wish'), wMsg = document.getElementById('wMsg'), wName = document.getElementById('wName'),
  wErr = document.getElementById('wErr'), wSend = document.getElementById('wSend');
const wishStars = [];
function openWish() { wErr.textContent = ''; wish.classList.add('show'); setTimeout(() => wMsg.focus(), 50); tone(880, .08, 'triangle', .1); }
const closeWish = () => wish.classList.remove('show');
document.getElementById('bWish').onclick = openWish;
document.getElementById('wCancel').onclick = closeWish;
wMsg.addEventListener('input', () => { document.getElementById('wCount').textContent = wMsg.value.length; });
wish.addEventListener('submit', async e => {
  e.preventDefault();
  const msg = wMsg.value.trim(), name = wName.value.trim() || 'Someone';
  if (!msg) { wErr.textContent = 'Write a little something first ✍'; wMsg.focus(); return; }
  const lastSent = +localStorage.getItem('pixel-xmas-wish-t') || 0;
  if (Date.now() - lastSent < 30000) { wErr.textContent = 'Just sent one! Wait a few seconds ⏳'; return; }
  if (!WISH_KEY) { wErr.textContent = 'Wishes aren’t set up yet.'; return; }
  wSend.disabled = true; wSend.textContent = 'Sending…'; wErr.textContent = '';
  try {
    const r = await fetch('https://api.web3forms.com/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ access_key: WISH_KEY, subject: `🎄 New Christmas wish from ${name}`, from_name: 'Pixel Christmas Tree',
        name, message: msg, botcheck: document.getElementById('wBot').checked }),
    });
    const j = await r.json();
    if (!j.success) throw new Error(j.message);
    localStorage.setItem('pixel-xmas-wish-t', Date.now());
    wMsg.value = ''; document.getElementById('wCount').textContent = 0; closeWish();
    sendWishStar();
  } catch (err) {
    wErr.textContent = 'Oops, it didn’t go through. Try again?';
  } finally { wSend.disabled = false; wSend.textContent = 'Send ✨'; }
});
function sendWishStar() {
  let tx, ty; do { tx = 8 + Math.random() * (W - 16); ty = 6 + Math.random() * 60; } while (Math.hypot(tx - 28, ty - 22) < 14 || Math.abs(tx - CX) < hwAt(Math.round(ty)) + 6);
  wishStars.push({ sx: CX, sy: 20, tx, ty, t0: performance.now() / 1000 });
  [659.25, 783.99, 987.77, 1318.5, 1567.98].forEach((f, i) => tone(f, .3, 'triangle', .1, i * .08));
  say('Delivered! Your wish is a star now ✨');
}

addEventListener('keydown', e => {
  if (wish.classList.contains('show')) { if (e.key === 'Escape') closeWish(); return; }
  if (card.classList.contains('show')) { if (e.key === 'Enter' || e.key === 'Escape') card.classList.remove('show'); return; }
  const k = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', 'arrowup', ' '].includes(k)) e.preventDefault();
  keys[k] = true; cl.idle = 0; cl.target = null;
  if ((k === ' ' || k === 'arrowup') && cl.ground) { cl.vy = -3.2; cl.ground = false; tone(520, .08, 'square', .04); tone(780, .08, 'square', .04, .05); }
  if (k === 'l') cycleLights();
  if (k === 's') toggleSnow();
  if (k === 'm') setMusic(!musicOn);
  if (k === 'x') shake();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ---------- Clawd ----------
const CLAWD = [
  '......RRW...',
  '.....RRRR...',
  '...RRRRRR...',
  '..WWWWWWWW..',
  '..OOOOOOOO..',
  '..OKOOOOKO..',
  'OOOOOOOOOOOO',
  '..OOOOOOOO..',
  '..O.O..O.O..',
  '..O.O..O.O..',
];
const CLAWD_WALK = ['.O..O..O..O.', '..O.O..O.O..'];
const CPAL = { O: '#d97757', K: '#1a1a1a', R: '#d62f3a', W: '#ffffff' };
function updateClawd(dt) {
  let dir = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['a'] ? 1 : 0);
  cl.idle += dt;
  if (!dir && cl.idle > 240) {
    if (!cl.target && Math.random() < .004) cl.target = 6 + Math.random() * (W - 18);
    if (cl.target != null) { if (Math.abs(cl.target - cl.x) < 1) cl.target = null; else dir = Math.sign(cl.target - cl.x) * .45; }
  }
  cl.x = Math.max(2, Math.min(W - 14, cl.x + dir * .9 * dt));
  if (dir) { cl.face = Math.sign(dir); cl.walk += dt; }
  cl.vy += .2 * dt; cl.y += cl.vy * dt;
  if (cl.y >= G) { cl.y = G; cl.vy = 0; cl.ground = true; }
  if (Math.random() < .006) cl.blink = 8;
  cl.blink = Math.max(0, cl.blink - dt);
}
function drawClawd() {
  const rows = CLAWD.slice();
  if (cl.blink > 0) rows[5] = '..OOOOOOOO..';
  if (!cl.ground) { rows[8] = '..O.O..O.O..'; rows[9] = '............'; }
  else if (cl.walk && Math.floor(cl.walk / 6) % 2) rows[9] = CLAWD_WALK[0];
  const x = Math.round(cl.x), y = Math.round(cl.y) - rows.length;
  // 影子
  for (let i = 1; i < 11; i++) px(x + i, G, '#9fb0e0', .7);
  drawSprite(rows, x, y, CPAL, 1, cl.face > 0);
}

// ---------- 画面 ----------
const skyStars = Array.from({ length: 46 }, () => {
  let x, y; do { x = Math.floor(R() * W); y = Math.floor(R() * 92); } while (Math.hypot(x - 28, y - 22) < 12);
  return { x, y, ph: R() * 6.28, sp: .5 + R() * 2, big: R() < .15 };
});
function hsl(h) { return `hsl(${h % 360},100%,62%)`; }
function lightColor(i, ph, c, t) {
  switch (lightMode) {
    case 0: return Math.sin(t * 3 + ph) > -.3 ? c : null;
    case 1: return (i + Math.floor(t * 7)) % 4 === 0 ? c : (i + Math.floor(t * 7)) % 4 === 1 ? c + '88' : null;
    case 2: return hsl(t * 140 + i * 24);
    case 3: return Math.sin(t * 9 + ph * 3) > -.9 ? '#ffd27a' : '#e0a850';
    default: return null;
  }
}
function drawLight(x, y, c) {
  if (!c) { px(x, y, '#3a3a50'); return; }
  px(x, y, c);
  ctx.globalAlpha = .35; ctx.fillStyle = c;
  ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x, y - 1, 1, 1); ctx.fillRect(x, y + 1, 1, 1);
  ctx.globalAlpha = 1;
}

let last = performance.now();
function frame(nowMs) {
  const dt = Math.min(3, (nowMs - last) / 16.67); last = nowMs;
  const t = nowMs / 1000;
  const starPower = t - starBurst < 3;

  ctx.drawImage(bg, 0, 0);
  for (const s of skyStars) {
    const b = (Math.sin(t * s.sp + s.ph) + 1) / 2;
    px(s.x, s.y, '#ffffff', .25 + b * .75);
    if (s.big && b > .7) { px(s.x - 1, s.y, '#ffffff', .4); px(s.x + 1, s.y, '#ffffff', .4); px(s.x, s.y - 1, '#ffffff', .4); px(s.x, s.y + 1, '#ffffff', .4); }
  }
  // 祝福变成的星星：从树顶飞上天空，然后一直挂在那里
  for (const w of wishStars) {
    const p = Math.min(1, (t - w.t0) / 1.6), e = 1 - Math.pow(1 - p, 3);
    const x = w.sx + (w.tx - w.sx) * e, y = w.sy + (w.ty - w.sy) * e - Math.sin(p * Math.PI) * 18;
    if (p < 1) { if (Math.random() < .7) parts.push({ x, y, vx: (Math.random() - .5) * .3, vy: Math.random() * .2, life: 25, c: Math.random() < .5 ? '#ffd84d' : '#ffffff', snow: true }); }
    const b = p < 1 ? 1 : .6 + Math.sin(t * 2 + w.tx) * .4;
    px(x, y, '#fff6d5');
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) px(x + dx, y + dy, '#ffd84d', b);
    if (b > .8) for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2]]) px(x + dx, y + dy, '#ffd84d', .4);
  }
  // 积雪
  ctx.fillStyle = '#f4f8ff';
  for (let x = 0; x < W; x++) { const h = Math.floor(pile[x]); if (h > 0) ctx.fillRect(x, G - h, 1, h); }

  // 树（摇一摇时左右晃）
  const st = t - shakeT, sx = st < .8 ? Math.round(Math.sin(st * 40) * 2 * (1 - st / .8)) : 0;
  ctx.drawImage(treeL, sx, 0);
  for (const [x, y] of tinsel) px(x + sx, y, (x + Math.floor(t * 4)) % 7 === 0 ? '#fff6d5' : '#e8b93a');
  garland.forEach((l, i) => drawLight(l.x + sx, l.y, starPower ? hsl(t * 300 + i * 30) : lightColor(i, l.ph, LIGHT_COLORS[i % 5], t)));

  // 装饰
  ornaments.forEach((o, i) => {
    let ox = 0;
    if (o.sw) { const e = t - o.sw; if (e > 0 && e < 2) ox = Math.round(Math.sin(e * 14) * 1.6 * Math.exp(-e * 2)); }
    if (o.t === 'light') { drawLight(o.x + sx + ox, o.y, starPower ? hsl(t * 300 + i * 30) : lightColor(i + 3, o.ph, o.c, t)); return; }
    const s = SPR[o.t];
    drawSprite(s, o.x - (s[0].length >> 1) + sx + ox, o.y - (s.length >> 1), o.c);
  });

  // 星星
  const glow = starPower ? 1 : .45 + Math.sin(t * 2) * .15, sr = starPower ? 9 : 6;
  for (let y = -sr; y <= sr; y++) for (let x = -sr; x <= sr; x++) {
    const d = Math.hypot(x, y);
    if (d > 3 && d <= sr && BAYER[(y + 12) % 4][(x + 12) % 4] < (1 - d / sr) * 16 * glow) px(CX + x, 20 + y, '#ffe680', .5);
  }
  drawSprite(SPR.star, CX - 4 + sx, 15, starPower && Math.floor(t * 10) % 2 ? { y: '#ffffff', h: '#ffd84d' } : null);

  // 礼物
  for (const g of gifts) {
    const top = G - g.h;
    g.lid += ((g.open ? 1 : 0) - g.lid) * .2 * dt;
    ctx.fillStyle = g.body; ctx.fillRect(g.x, top, g.w, g.h);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(g.x + g.w - 2, top, 2, g.h);
    const cx = g.x + (g.w >> 1) - 1;
    ctx.fillStyle = g.rib; ctx.fillRect(cx, top, 2, g.h);
    if (g.lid > .5) { ctx.fillStyle = '#fff6d5'; for (let i = 0; i < 3; i++) if (Math.sin(t * 6 + i * 2) > 0) px(g.x + 2 + i * ((g.w - 4) / 2), top - 2 - i % 2, '#fff6d5'); }
    const ly = top - 3 - Math.round(g.lid * 8), lx = g.x - 1 + Math.round(g.lid * 3);
    ctx.fillStyle = g.body; ctx.fillRect(lx, ly, g.w + 2, 3);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(lx, ly, g.w + 2, 1);
    ctx.fillStyle = g.rib; ctx.fillRect(lx + (g.w >> 1), ly, 2, 3);
    drawSprite(['r.r', '.r.'], lx + (g.w >> 1) - 0.5 | 0, ly - 2, { r: g.rib });
    if (!g.open && Math.sin(t * 2 + g.x) > .97) px(g.x + 1, top + 1, '#ffffff');
  }

  // Clawd
  updateClawd(dt); drawClawd();

  // 雪花
  for (const f of snow) {
    if (!snowOn && f.y < 0) continue;
    f.y += f.v * dt; f.x += Math.sin(t + f.ph) * .12 * dt;
    if (f.x < 0) f.x += W; if (f.x >= W) f.x -= W;
    const xi = Math.floor(f.x);
    if (f.y >= G - pile[xi]) {
      if (pile[xi] < 4) { pile[xi] += .35; if (xi > 0) pile[xi - 1] += .12; if (xi < W - 1) pile[xi + 1] += .12; }
      Object.assign(f, newFlake(false)); if (!snowOn) f.y = -50;
      continue;
    }
    if (f.y < 0) continue;
    px(f.x, f.y, '#ffffff', f.big ? 1 : .8);
    if (f.big) { px(f.x + 1, f.y, '#ffffff', .5); px(f.x, f.y + 1, '#ffffff', .5); }
  }
  if (!snowOn) for (let x = 0; x < W; x++) pile[x] = Math.max(0, pile[x] - .002 * dt);

  // 粒子
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.snow ? .02 : .05) * dt; p.vx *= .98; p.life -= dt;
    if (p.life <= 0 || p.y > H) { parts.splice(i, 1); continue; }
    px(p.x, p.y, p.c, Math.min(1, p.life / 20));
  }

  // 鼠标预览
  if (mouse && tool !== 'erase' && inTree(mouse[0], mouse[1]) && hitOrnament(mouse[0], mouse[1]) < 0) {
    const s = SPR[tool], c = tool === 'light' ? LIGHT_COLORS[(colorIdx + 1) % 5] : ORN_COLORS[colorIdx % ORN_COLORS.length];
    drawSprite(s, mouse[0] - (s[0].length >> 1), mouse[1] - (s.length >> 1), c, .55);
  }

  // 气泡位置
  if (bubbleT && nowMs > bubbleT) { bubble.classList.remove('show'); bubbleT = 0; }
  const sc = cv.clientWidth / W;
  const half = bubble.offsetWidth / 2 + 4;
  bubble.style.left = Math.max(half, Math.min(cv.clientWidth - half, (cl.x + 6) * sc)) + 'px';
  bubble.style.top = (cl.y - 12) * sc + 'px';

  requestAnimationFrame(frame);
}

function fit() {
  const fitS = Math.min((innerWidth - 24) / W, (innerHeight - 150) / H);
  const s = fitS >= 2 ? Math.floor(fitS) : Math.max(1, Math.min(2, (innerWidth - 24) / W));
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();
requestAnimationFrame(frame);
setTimeout(() => say('Hi! I’m down here~ click me'), 800);
})();
</script>
</body>
</html>
